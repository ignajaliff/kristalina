server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html: NUNCA cachear. Es el archivo que apunta a los hashes de los
    # bundles JS/CSS. Cada deploy genera hashes nuevos y los usuarios deben verlos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bundles hasheados: cache agresivo de 1 año (immutable). Su nombre cambia
    # en cada deploy así que no hay riesgo de servir versión vieja.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
